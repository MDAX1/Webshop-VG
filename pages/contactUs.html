<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>

  <body class="bg-dark text-light d-flex flex-column min-vh-100">
    <header class="bg-primary">
      <nav class="navbar navbar-expand-lg navbar-dark container">
        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="../index.html">Webshop</a>

        <!-- Hamburger button -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Links -->
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav gap-lg-3 text-center">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="aboutUs.html">About</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="contactUs.html">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link position-relative" href="pages/cart.html">
                🛒
                <span
                  id="cart-badge"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  style="display: none"
                  >0</span
                >
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <main class="container py-5 d-flex justify-content-center flex-grow-1">
      <div class="col-lg-6 col-md-8 col-12">
        <div class="card shadow-lg p-4 bg-secondary text-light border-0">
          <h3 class="mb-4 text-center">Contact Us</h3>
          <form action="thankyou.html">
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                placeholder="First and last name"
                required
              />
            </div>
            <div class="mb-3">
              <label for="tel" class="form-label">Phone Number</label>
              <input
                type="tel"
                id="tel"
                name="tel"
                class="form-control"
                placeholder="+46xxxxxxxxx"
                required
              />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                placeholder="email@example.com"
                required
              />
            </div>
            <div class="mb-4">
              <label for="text" class="form-label">Message</label>
              <textarea
                id="text"
                name="text"
                class="form-control"
                rows="5"
                required
              ></textarea>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">
                Submit
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <footer class="bg-primary text-center text-white py-4">
      <div class="container">
        <ul class="nav justify-content-center mb-3">
          <li class="nav-item">
            <a href="../index.html" class="nav-link text-white">Home</a>
          </li>
          <li class="nav-item">
            <a href="/pages/contactUs.html" class="nav-link text-white"
              >Contact</a
            >
          </li>
          <li class="nav-item">
            <a href="/pages/aboutUs.html" class="nav-link text-white">About</a>
          </li>
        </ul>
        <hr class="border-light" />
        <p class="mb-0 opacity-75">© 2026 Webshop, Inc</p>
      </div>
    </footer>
  </body>
</html>
