<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>

  <body class="bg-dark text-light d-flex flex-column min-vh-100">
    <header class="bg-primary p-2">
      <nav class="navbar navbar-expand-lg navbar-dark container">
        <a class="navbar-brand fw-bold" href="../index.html">Webshop</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav gap-lg-3 text-center">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="aboutUs.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contactUs.html">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link position-relative" href="pages/cart.html">
                🛒
                <span
                  id="cart-badge"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  style="display: none"
                  >0</span
                >
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <main class="flex-grow-1">
      <section class="order-section container py-5">
        <div class="mb-4">
          <a href="../index.html" class="btn btn-outline-light">
            ← Back to shop
          </a>
        </div>
        <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-8">
            <div
              class="card shadow-lg border-0 rounded-4 bg-secondary text-light"
            >
              <div class="card-body p-4 p-md-5">
                <h2 class="mb-4 text-center">Order</h2>
                <form id="order-form" novalidate>
                  <div class="row g-3">
                    <div class="col-12 col-md-6">
                      <label for="name" class="form-label">Name</label>
                      <input
                        type="text"
                        class="form-control form-control-lg"
                        id="name"
                      />
                      <small id="name-error" class="text-danger"></small>
                    </div>
                    <div class="col-12 col-md-6">
                      <label for="lastname" class="form-label">Last Name</label>
                      <input
                        type="text"
                        class="form-control form-control-lg"
                        id="lastname"
                      />
                      <small id="lastname-error" class="text-danger"></small>
                    </div>
                    <div class="col-12 col-md-6">
                      <label for="email" class="form-label">Email</label>
                      <input
                        type="email"
                        class="form-control form-control-lg"
                        id="email"
                      />
                      <small id="email-error" class="text-danger"></small>
                    </div>
                    <div class="col-12 col-md-6">
                      <label for="phone" class="form-label">Phone</label>
                      <input
                        type="text"
                        class="form-control form-control-lg"
                        id="phone"
                      />
                      <small id="phone-error" class="text-danger"></small>
                    </div>
                    <div class="col-12">
                      <label for="street" class="form-label"
                        >Street Address</label
                      >
                      <input
                        type="text"
                        class="form-control form-control-lg"
                        id="street"
                      />
                      <small id="street-error" class="text-danger"></small>
                    </div>
                    <div class="col-6 col-md-4">
                      <label for="country" class="form-label">Country</label>
                      <input
                        type="text"
                        class="form-control form-control-lg"
                        id="country"
                      />
                      <small id="country-error" class="text-danger"></small>
                    </div>
                    <div class="col-6 col-md-4">
                      <label for="city" class="form-label">City</label>
                      <input
                        type="text"
                        class="form-control form-control-lg"
                        id="city"
                      />
                      <small id="city-error" class="text-danger"></small>
                    </div>
                    <div class="col-12 col-md-4">
                      <label for="zipcode" class="form-label">Zip Code</label>
                      <input
                        type="text"
                        class="form-control form-control-lg"
                        id="zipcode"
                      />
                      <small id="zipcode-error" class="text-danger"></small>
                    </div>
                    <div class="col-12">
                      <small
                        id="product-error"
                        class="text-danger d-block mb-2"
                      ></small>
                    </div>
                    <div class="col-12 d-grid mt-3">
                      <button
                        type="submit"
                        class="btn btn-primary btn-lg rounded-3"
                      >
                        Submit Order
                      </button>
                    </div>
                  </div>
                </form>
                <div
                  id="success-message"
                  class="mt-4 fw-semibold text-success text-center"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="bg-primary text-center text-white py-4">
      <div class="container">
        <ul class="nav justify-content-center mb-3">
          <li class="nav-item">
            <a href="../index.html" class="nav-link text-white">Home</a>
          </li>
          <li class="nav-item">
            <a href="aboutUs.html" class="nav-link text-white">About</a>
          </li>
          <li class="nav-item">
            <a href="contactUs.html" class="nav-link text-white">Contact</a>
          </li>
        </ul>
        <hr class="border-light" />
        <p class="mb-0 opacity-75">© 2026 Webshop, Inc</p>
      </div>
    </footer>
    <script src="../js/webshop.js"></script>
  </body>
</html>
