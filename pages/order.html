<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="../js/webshop.js" defer></script>
</head>

<body class="bg-dark text-light d-flex flex-column min-vh-100">

<header class="bg-primary">
  <nav class="navbar navbar-expand-lg navbar-dark container">
    <a class="navbar-brand" href="../index.html">Webshop</a>

    <div class="collapse navbar-collapse justify-content-end">
      <ul class="navbar-nav gap-3">
        <li><a class="nav-link" href="../index.html">Home</a></li>
        <li><a class="nav-link" href="aboutUs.html">About</a></li>
        <li><a class="nav-link" href="contactUs.html">Contact</a></li>
        <li>
          <a class="nav-link position-relative" href="cart.html">
            🛒
            <span id="cart-badge"
              class="badge bg-danger position-absolute top-0 start-100 translate-middle"></span>
          </a>
        </li>
      </ul>
    </div>
  </nav>
</header>

<main class="container py-5 flex-grow-1">

  <h2 class="mb-4">Checkout</h2>

  <!-- IMPORTANT: NO action attribute -->
  <form id="order-form" novalidate>

    <input id="name" class="form-control mb-3" placeholder="Name">
    <small id="name-error" class="text-danger"></small>

    <input id="email" class="form-control mb-3" placeholder="Email">
    <small id="email-error" class="text-danger"></small>

    <input id="phone" class="form-control mb-3" placeholder="Phone">
    <small id="phone-error" class="text-danger"></small>

    <input id="street" class="form-control mb-3" placeholder="Street">
    <small id="street-error" class="text-danger"></small>

    <input id="city" class="form-control mb-3" placeholder="City">
    <small id="city-error" class="text-danger"></small>

    <input id="zipcode" class="form-control mb-3" placeholder="Zipcode">
    <small id="zipcode-error" class="text-danger"></small>

    <button class="btn btn-primary w-100">Place Order</button>

  </form>

</main>
<footer class="bg-primary text-center text-white py-4 mt-auto">
  <div class="container">
    <p class="mb-0">© 2026 Webshop</p>
  </div>
</footer>
</body>
</html>
